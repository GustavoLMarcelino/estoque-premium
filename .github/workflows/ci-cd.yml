name: Frontend CI (minimal)

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop
      - feature/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # versão no .nvmrc, a mesma do deploy.yml e da EC2 (o workbox do PWA não roda no node 18)
        node-version-file: '.nvmrc'
        cache: npm

    - name: Instalar dependências
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Build (Vite)
      run: npm run build

    - name: Validar schema Prisma (SQLite/dev)
      run: npx prisma validate --schema=backend/prisma/schema.prisma
      env:
        DATABASE_URL: 'file:./ci-dummy.db'

    - name: Validar schema Prisma (MySQL/prod)
      run: npx prisma validate --schema=backend/prisma/schema.mysql.prisma
      env:
        DATABASE_URL_MYSQL: 'mysql://ci:ci@localhost:3306/ci'

    - name: Checar drift entre os schemas dev/prod
      run: node backend/scripts/check-schema-drift.mjs

    - name: Testes automatizados (backend)
      run: npm test -w backend
