name: Frontend CI (minimal)

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop
      - feature/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # a versão fica no .nvmrc, o mesmo arquivo que o deploy.yml usa
        node-version-file: '.nvmrc'
        cache: npm

    - name: Instalar dependências
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Build (Vite)
      run: npm run build
