name: Deploy para Produção (EC2)

on:
  push:
    branches:
      - main
  # Liberação PONTUAL do guard de SQL: destrava este run sem esperar o push que
  # registra o .sql em APLICADOS.md. O gate normal é a cobertura pelo ledger —
  # ver backend/scripts/guard-sql-pendente.mjs.
  #
  # Não é obrigatório: com todos os .sql já registrados, um dispatch é só um
  # redeploy. Exigir o nome sempre treinaria a digitar um arquivo que não foi
  # rodado agora — exatamente o reflexo que o guard existe para evitar.
  #
  # O plano do repo (Free + privado) não permite Environment com required
  # reviewers — o GitHub recusa a regra com 422 "billing plan supports the
  # required reviewers protection rule". Por isso a porta é este input, que só
  # existe DEPOIS do push: não dá para pré-armar no commit.
  workflow_dispatch:
    inputs:
      sql_aplicado:
        description: 'Só se houver SQL pendente: nome do .sql já rodado no RDS (ex.: 2026-08-03-parcelas-pedido-som.sql). Precisa ser arquivo REAL do repo. Libera este run; registre em APLICADOS.md depois.'
        required: false
        type: string

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  # Guard anti-apagão: trava o deploy enquanto houver SQL manual no repositório
  # que não conste como aplicado em backend/prisma/sql/APLICADOS.md.
  #
  # O gate é por COBERTURA (estado), não pelo diff do push. A versão anterior
  # olhava só o range e tinha um furo: o push que trazia o .sql era bloqueado,
  # mas o push SEGUINTE passava verde e deployava o HEAD — que já continha o
  # código dependente do SQL não aplicado. Agora um .sql não registrado trava
  # TODO deploy, inclusive pushes laterais, até a linha entrar no ledger.
  #
  # Job PRÓPRIO (não step do check) para aparecer com nome na UI e não atrapalhar
  # o feedback dos testes, que seguem rodando em paralelo. Roda no runner do
  # GitHub — nunca toca a EC2.
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código (histórico completo)
        uses: actions/checkout@v4
        with:
          # O gate de cobertura só lê arquivos, mas o gatilho secundário (mexeu
          # no schema.mysql.prisma sem escrever SQL) ainda compara o range — e o
          # clone shallow padrão não tem o commit anterior.
          fetch-depth: 0

      - name: Verificar SQL manual pendente
        id: verificar
        run: node backend/scripts/guard-sql-pendente.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SHA_ANTES: ${{ github.event.before }}
          SHA_DEPOIS: ${{ github.event.after || github.sha }}
          SQL_APLICADO: ${{ inputs.sql_aplicado }}

      - name: Notificar bloqueio por email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Estoque Premium Deploy <${{ secrets.SMTP_USERNAME }}>
          subject: "🛑 Deploy BLOQUEADO — SQL manual pendente (Estoque Premium)"
          body: |
            O deploy foi BLOQUEADO pelo guard de SQL.
            A produção NÃO foi tocada e segue na versão anterior, intacta.

            Motivo: ${{ steps.verificar.outputs.motivo }}
            Arquivos: ${{ steps.verificar.outputs.arquivos }}

            Commit: ${{ github.sha }}
            Mensagem: ${{ github.event.head_commit.message }}
            Autor: ${{ github.actor }}

            PARA LIBERAR:
              1. Rode o SQL no RDS (snapshot antes).
              2. Registre em backend/prisma/sql/APLICADOS.md (uma linha por
                 arquivo, na coluna "Arquivo") e faça push.
                 → o deploy destrava sozinho.

            Se precisar deployar antes de registrar:
              Actions → "Deploy para Produção (EC2)" → Run workflow →
              em "sql_aplicado", o nome do arquivo. Isso libera SÓ aquele run;
              sem a linha no ledger, o próximo push volta a travar.

            Log completo:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Gate de build: roda no runner do GitHub, ANTES de tocar na EC2.
  # Se qualquer verificação falhar, o job deploy nem inicia — a produção
  # não recebe git pull de código quebrado.
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Espelha a versão de produção na EC2 (v20.20.2)
          node-version: '20'
          cache: npm

      - name: Instalar dependências (workspaces frontend + backend)
        run: npm ci

      - name: Build do frontend
        run: npm run build -w frontend

      # prisma validate resolve env("...") do datasource; valores dummy bastam
      # (não há conexão com banco — só validação de schema).
      - name: Validar schema Prisma (SQLite/dev)
        run: npx prisma validate --schema=backend/prisma/schema.prisma
        env:
          DATABASE_URL: 'file:./ci-dummy.db'

      - name: Validar schema Prisma (MySQL/prod)
        run: npx prisma validate --schema=backend/prisma/schema.mysql.prisma
        env:
          DATABASE_URL_MYSQL: 'mysql://ci:ci@localhost:3306/ci'

      - name: Checar drift entre os schemas dev/prod
        run: node backend/scripts/check-schema-drift.mjs

      # Testes criam seu próprio SQLite temporário (tests/setup.js) — não
      # precisam de env nem de banco externo.
      - name: Testes automatizados (backend)
        run: npm test -w backend

      - name: Notificar falha do gate por email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Estoque Premium Deploy <${{ secrets.SMTP_USERNAME }}>
          subject: "🚫 Build/validação FALHOU — deploy NÃO executado (Estoque Premium)"
          body: |
            O gate de build/validação falhou e o deploy NÃO foi executado.
            A produção continua na versão anterior, intacta.

            Commit: ${{ github.sha }}
            Mensagem: ${{ github.event.head_commit.message }}
            Autor: ${{ github.actor }}

            Veja qual verificação quebrou (build do frontend ou prisma validate):
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    # Os DOIS portões: build/testes verdes E nenhum SQL manual pendente.
    needs: [check, guard]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          command_timeout: 20m
          # ATENÇÃO: a chave de deploy usa forced command na EC2 — o script
          # efetivamente executado é o do authorized_keys, que deve ser mantido
          # idêntico a este (incluindo o healthcheck abaixo).
          script: |
            cd /var/www/estoque-premium && git pull origin main && cd frontend && npm run build && cd ../backend && npx prisma generate --schema=prisma/schema.mysql.prisma && pm2 restart estoque-premium
            sleep 5
            curl -fsS http://localhost:3000/api/health

      - name: Capturar horário do deploy
        id: meta
        if: always()
        run: echo "time=$(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M:%S %Z')" >> "$GITHUB_OUTPUT"

      - name: Notificar sucesso por email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Estoque Premium Deploy <${{ secrets.SMTP_USERNAME }}>
          subject: "✅ Deploy OK — Estoque Premium (${{ github.ref_name }})"
          body: |
            Deploy em produção concluído com sucesso.

            Commit: ${{ github.sha }}
            Mensagem: ${{ github.event.head_commit.message }}
            Autor: ${{ github.actor }}
            Horário: ${{ steps.meta.outputs.time }}

            Detalhes do run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notificar falha por email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Estoque Premium Deploy <${{ secrets.SMTP_USERNAME }}>
          subject: "❌ Deploy FALHOU — Estoque Premium (${{ github.ref_name }})"
          body: |
            O deploy automático em produção FALHOU.

            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Horário: ${{ steps.meta.outputs.time }}

            Veja os logs completos do run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Se necessário, faça o deploy manual conforme descrito no DEPLOY.md.
