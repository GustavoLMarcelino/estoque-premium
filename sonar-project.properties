# Configuração da análise no SonarQube Cloud (lida pelo workflow sonar.yml).
sonar.organization=gustavolmarcelino
sonar.projectKey=GustavoLMarcelino_estoque-premium
sonar.projectName=Estoque Premium
sonar.sourceEncoding=UTF-8

# Código de produção e código de teste em listas separadas: o Sonar mede a
# cobertura só das fontes e não aponta problemas de "código sem teste" nos testes.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests

# Relatórios gerados por "npm run test:coverage -w backend" e "-w frontend".
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Fora da análise: dependências, builds, relatórios, dados/modelos do stockmind
# (pasta stockmind/ na raiz: scripts Python, data/ e modelos/) e arquivos gerados.
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-ssr/**,**/coverage/**,stockmind/**,**/*.min.js,**/*.d.ts,**/*.map
sonar.test.exclusions=**/node_modules/**,**/coverage/**

# Mesmos arquivos que o frontend/vitest.config.js tira da conta de cobertura.
sonar.coverage.exclusions=frontend/src/main.jsx,**/*.d.ts
